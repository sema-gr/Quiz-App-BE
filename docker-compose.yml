version: "3.9"

services:
  backend:
    build: .
    container_name: quiz-be
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: poetry run uvicorn main:app --host 0.0.0.0 --port ${PORT}

  db:
    image: postgres:15
    container_name: quiz-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: quiz-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pg_data:
